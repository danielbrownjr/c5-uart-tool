name: Verify
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-tool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python host protocol tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q tools tests

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: ESP32-C5 firmware build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c5
          extra_docker_args: -e GITHUB_RUN_ID
          command: bash tools/build-verify.sh && C5_BOARD_PROFILE=cyd bash tools/build-verify.sh
      - name: Save linked firmware and flash layout (do not flash)
        uses: actions/upload-artifact@v6
        with:
          name: c5-uart-tool-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/retained/
            build-cyd/retained/
          if-no-files-found: error
          retention-days: 90
